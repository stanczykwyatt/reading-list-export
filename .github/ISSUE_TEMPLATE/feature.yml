name: Feature request
description: Suggest an idea, or a change to the files it writes.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?
  - type: textarea
    id: app
    attributes:
      label: Where does your export go?
      description: The read-later or bookmark app you're moving to, or the notes app you export into, if it matters for this.
